<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chibi FBX Test</title>
  <style>
    body {
      margin: 0;
      background: #202428;
      color: white;
      font-family: sans-serif;
      overflow: hidden;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 8px;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="info">
    <h3>Chibi 3D Preview</h3>
    <div id="status">Loading model...</div>
    <div id="bones"></div>
  </div>
  <canvas id="c"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { FBXLoader } from 'three/examples/jsm/loaders/FBXLoader.js';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

    const canvas = document.getElementById('c');
    const status = document.getElementById('status');
    const bonesDiv = document.getElementById('bones');

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1c23);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0.75, 1.7);

    const controls = new OrbitControls(camera, canvas);
    controls.target.set(0, 0.45, 0);
    controls.update();

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(1, 3, 2);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(10, 20, 0x555555, 0x333333);
    grid.position.y = 0;
    scene.add(grid);

    // Texture loader
    const texLoader = new THREE.TextureLoader();
    const textures = {
      body: texLoader.load('./textures/Body_D.png'),
      hair: texLoader.load('./textures/Hair_D.png'),
      face: texLoader.load('./textures/Face_D.png'),
      cheek: texLoader.load('./textures/Cheek_D.png'),
      eye: texLoader.load('./textures/Eyes_D.png'),
      mouth: texLoader.load('./textures/Mouth_D.png'),
      brow: texLoader.load('./textures/Brows_D.png'),
      tail: texLoader.load('./textures/Tail_D.png')
    };

    Object.values(textures).forEach(t => {
      t.colorSpace = THREE.SRGBColorSpace;
      t.flipY = true;
    });

    const models = [
      { name: 'Special Week (Agemasen)', file: './source/agemasen.fbx' },
      { name: 'Silence Suzuka', file: './source/suzuka small.fbx' },
      { name: 'Oguri Cap', file: './source/fatty.fbx' },
      { name: 'Daitaku Helios', file: './source/helios.fbx' },
      { name: 'Matikane Tannhauser (Mambo)', file: './source/Mambo.fbx' }
    ];

    const loader = new FBXLoader();
    let model = null;
    const bones = {};

    loader.load('./source/agemasen.fbx', (fbx) => {
      model = fbx;
      status.innerText = 'Model loaded successfully!';

      fbx.scale.setScalar(0.01);
      fbx.rotation.y = 1.28;
      scene.add(fbx);

      fbx.traverse((child) => {
        if (child.isBone) {
          bones[child.name] = child;
        }
        if (child.isMesh) {
          console.log('Mesh found:', child.name);
          const geom = child.geometry;
          const matArray = Array.isArray(child.material) ? child.material : [child.material];
          const texturesList = {
            body: texLoader.load('./textures/tex_mbdy1001_00_diff.png'),
            hair: texLoader.load('./textures/tex_mchr1001_00_hair_diff.png'),
            face: texLoader.load('./textures/tex_mchr0001_00_face0_1_diff.png'),
            cheek: texLoader.load('./textures/tex_mchr0001_00_face0_0_cheek0.png'),
            eye: texLoader.load('./textures/tex_mchr1001_00_eye_diff.png'),
            mouth: texLoader.load('./textures/tex_mchr1001_00_mouth_diff.png'),
            brow: texLoader.load('./textures/tex_mchr1001_00_mayu_diff.png'),
            tail: texLoader.load('./textures/tex_mtail0001_00_1001_diff.png')
          };
          Object.values(texturesList).forEach(t => {
            t.colorSpace = THREE.SRGBColorSpace;
            t.flipY = true;
          });

          const logLines = [];
          matArray.forEach((m, idx) => {
            if (!m) return;
            const name = (m.name || '').toLowerCase();
            m.roughness = 0.92;
            m.metalness = 0.0;
            m.color.setHex(0xffffff);

            if (name === 'transparent' || name.includes('transp') || name === 'front') {
              m.transparent = true;
              m.opacity = 0;
              m.visible = false;
              logLines.push(`[${idx}] "${m.name}" -> HIDDEN`);
              return;
            }

            let tex = null;
            if (name.includes('body')) { tex = texturesList.body; m.transparent = false; }
            else if (name.includes('hair')) { tex = texturesList.hair; m.transparent = false; m.visible = true; }
            else if (name.includes('face') || name.includes('head')) {
              tex = texturesList.face;
              m.transparent = false;
              m.renderOrder = 0;
              m.visible = true;
            }
            else if (name.includes('tail')) { tex = texturesList.tail; m.transparent = false; }
            else if (name.includes('eye')) {
              tex = null;
              matArray[idx] = new THREE.MeshStandardMaterial({
                map: texturesList.eye,
                roughness: 0.9,
                metalness: 0.0,
                side: THREE.DoubleSide,
                depthTest: false,
                depthWrite: false
              });
              child.material = matArray;
              return;
            }
            else if (name.includes('mouth')) {
              tex = texturesList.mouth;
              m.transparent = false; // Mouth_D.png is OPAQUE!
              m.depthTest = false;
              m.renderOrder = 997;
            }
            else if (name.includes('cheek')) {
              tex = texturesList.cheek;
              m.transparent = true;
              m.depthTest = false;
              m.renderOrder = 997;
            }
            else if (name.includes('brow')) {
              tex = texturesList.brow;
              m.transparent = true;
              m.depthTest = false;
              m.renderOrder = 999;
            }

            if (tex) {
              m.map = tex;
              m.needsUpdate = true;
            }
            logLines.push(`[${idx}] "${m.name}" -> tex:${tex ? 'YES' : 'NO'}, trans:${m.transparent}, depthTest:${m.depthTest}`);
          });
          bonesDiv.innerHTML += '<br>' + logLines.join('<br>');
        }
      });

      fbx.traverse((child) => {
        if (child.isBone) {
          child.userData.restRotation = child.rotation.clone();
          child.userData.restPosition = child.position.clone();
          bones[child.name] = child;
        }
      });
      window.__BONES__ = bones;
      window.__MODEL__ = fbx;
      bonesDiv.innerHTML = `Found ${Object.keys(bones).length} bones.<br>` + bonesDiv.innerHTML;
    }, (progress) => {
      status.innerText = `Loading: ${((progress.loaded / progress.total) * 100).toFixed(0)}%`;
    }, (err) => {
      status.innerText = 'Error loading FBX: ' + err.message;
      console.error(err);
    });

    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      if (model && bones['Arm_L'] && bones['Arm_R']) {
        const speed = 7;
        const walkCycle = Math.sin(t * speed);
        const cosCycle = Math.cos(t * speed);

        // Relax arms down, natural elbow flex, and fluid swing
        bones['Arm_L'].rotation.set(-walkCycle * 0.15, 0, -1.15 + walkCycle * 0.4);
        bones['Arm_R'].rotation.set(walkCycle * 0.15, 0, 1.15 + walkCycle * 0.4);
        if (bones['Elbow_L']) bones['Elbow_L'].rotation.set(0.4 + Math.max(0, walkCycle * 0.25), 0, 0);
        if (bones['Elbow_R']) bones['Elbow_R'].rotation.set(0.4 + Math.max(0, -walkCycle * 0.25), 0, 0);
        if (bones['Wrist_L']) bones['Wrist_L'].rotation.set(0, 0, -walkCycle * 0.2);
        if (bones['Wrist_R']) bones['Wrist_R'].rotation.set(0, 0, walkCycle * 0.2);

        // Leg pendulum relative to rest rotation
        const restThighL = bones['Thigh_L']?.userData.restRotation;
        const restThighR = bones['Thigh_R']?.userData.restRotation;
        const restKneeL = bones['Knee_L']?.userData.restRotation;
        const restKneeR = bones['Knee_R']?.userData.restRotation;
        const restAnkleL = bones['Ankle_L']?.userData.restRotation;
        const restAnkleR = bones['Ankle_R']?.userData.restRotation;

        const swing = walkCycle * 0.55;
        if (bones['Thigh_L'] && restThighL) {
          bones['Thigh_L'].rotation.x = restThighL.x + swing;
        }
        if (bones['Thigh_R'] && restThighR) {
          bones['Thigh_R'].rotation.x = restThighR.x - swing;
        }
        if (bones['Knee_L'] && restKneeL) {
          bones['Knee_L'].rotation.x = restKneeL.x + Math.max(0, swing * 0.7);
        }
        if (bones['Knee_R'] && restKneeR) {
          bones['Knee_R'].rotation.x = restKneeR.x + Math.max(0, -swing * 0.7);
        }
        if (bones['Ankle_L'] && restAnkleL) {
          bones['Ankle_L'].rotation.x = restAnkleL.x - swing * 0.2;
        }
        if (bones['Ankle_R'] && restAnkleR) {
          bones['Ankle_R'].rotation.x = restAnkleR.x + swing * 0.2;
        }

        // Hip bounce & waddle
        if (bones['Hip']) {
          const restHipPos = bones['Hip'].userData.restPosition;
          const restHipRot = bones['Hip'].userData.restRotation;
          bones['Hip'].position.y = restHipPos.y + Math.abs(cosCycle) * 0.04;
          bones['Hip'].rotation.set(
            restHipRot.x,
            restHipRot.y + walkCycle * 0.06,
            restHipRot.z + walkCycle * 0.08
          );
        }

        // Head bob
        if (bones['Head']) {
          const restHeadRot = bones['Head'].userData.restRotation;
          bones['Head'].rotation.set(
            restHeadRot.x + Math.sin(t * 3) * 0.05,
            restHeadRot.y,
            restHeadRot.z - walkCycle * 0.05
          );
        }

        // Ear twitch
        if (bones['Ear_01_L'] && bones['Ear_01_R']) {
          bones['Ear_01_L'].rotation.z = Math.sin(t * 12) * (Math.sin(t * 2) > 0.7 ? 0.2 : 0.02);
          bones['Ear_01_R'].rotation.z = -Math.sin(t * 12) * (Math.sin(t * 2.5) > 0.7 ? 0.2 : 0.02);
        }

        // Tail wag
        if (bones['Tail_Ctrl'] || bones['Sp_Hi_Tail0_B_00']) {
          const tail = bones['Tail_Ctrl'] || bones['Sp_Hi_Tail0_B_00'];
          tail.rotation.y = Math.sin(t * speed) * 0.5;
          tail.rotation.x = 0.2 + Math.sin(t * speed * 2) * 0.1;
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
